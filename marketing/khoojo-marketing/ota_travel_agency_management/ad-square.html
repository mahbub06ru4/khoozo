<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<title>Khoozo ad — square</title>
<link rel="stylesheet" href="ad.css" />
<style>
  .ad { width: 1080px; height: 1080px; }
  .shade {
    background:
      linear-gradient(180deg, rgb(0 0 0 / .55) 0%, rgb(0 0 0 / 0) 28%),
      linear-gradient(0deg, rgb(143 10 16 / .97) 0%, rgb(212 20 28 / .92) 34%, rgb(255 106 0 / .55) 58%, rgb(255 106 0 / 0) 75%);
  }
  .top { position: absolute; top: 48px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: flex-start; }
  .badge { width: 210px; height: 210px; }
  .badge span { font-size: 30px; }
  .badge strong { font-size: 84px; }
  .body { position: absolute; left: 56px; right: 56px; bottom: 52px; }
  .headline { font-size: 86px; margin-bottom: 10px; }
  .sub { font-size: 32px; font-weight: 500; opacity: .95; margin-bottom: 28px; }
  .pills { margin-bottom: 30px; }
  .pill { font-size: 30px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .cta { font-size: 38px; padding: 18px 38px; }
  .price { font-size: 34px; }
</style>
</head>
<body>
<div class="ad">
  <img class="bg" src="../public/images/hero/holidays.jpg" alt="" />
  <div class="shade"></div>

  <div class="top">
    <div class="brand">
      <img src="../public/logo.png" alt="" />
      <div><b>Khoozo</b><small>TRAVEL</small></div>
    </div>
    <div class="badge"><div><span>সর্বোচ্চ</span><strong>১৫%</strong><span>ছাড়</span></div></div>
  </div>

  <div class="body">
    <h1 class="headline">স্বপ্নের ভ্রমণ,<br /><em>এখন এক ক্লিকে!</em></h1>
    <p class="sub">লুকানো চার্জ ছাড়া স্বচ্ছ দাম · ২৪/৭ সাপোর্ট</p>

    <div class="pills">
      <div class="pill"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></i>ফ্লাইট</div>
      <div class="pill"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></svg></i>হোটেল</div>
      <div class="pill"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i>হলিডে</div>
      <div class="pill"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 3 9 3 12 0v-5M22 10v6"/></svg></i>স্টুডেন্ট ভিসা</div>
    </div>

    <div class="row">
      <div>
        <p class="price">ফ্লাইট মাত্র <span class="tk">৩,৯৯৯ টাকা</span> থেকে</p>
        <div class="pay" style="margin-top:12px"><span class="bk">bKash</span><span class="ng">Nagad</span><span class="rk">Rocket</span><span class="vs">VISA</span><span class="mc">Mastercard</span></div>
      </div>
      <span class="cta">এখনই বুক করুন <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>
