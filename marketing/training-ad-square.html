<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<title>Khoozo Training ad — square</title>
<link rel="stylesheet" href="training-ad.css" />
<style>
  .ad { width: 1080px; height: 1080px; }
  .top { position: absolute; top: 46px; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: flex-start; }
  .badge { width: 200px; height: 200px; }
  .badge span { font-size: 28px; }
  .badge strong { font-size: 80px; }
  .head { position: absolute; top: 170px; left: 56px; right: 300px; }
  .ribbon { font-size: 26px; padding: 6px 20px; margin-bottom: 14px; }
  .headline { font-size: 78px; }
  .cards { position: absolute; top: 510px; left: 56px; right: 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .course { height: 400px; }
  .course .ph { height: 230px; }
  .course .ph b { font-size: 38px; }
  .course .info { padding: 0 22px 20px; }
  .course .meta { font-size: 23px; position: absolute; left: 22px; top: 240px; }
  .old { font-size: 28px; margin-bottom: 6px; }
  .now { font-size: 64px; }
  .now small { font-size: 30px; }
  .off { font-size: 26px; padding: 10px 14px; margin-bottom: 6px; }
  .bottom { position: absolute; left: 56px; right: 56px; bottom: 36px; display: flex; align-items: center; justify-content: space-between; }
  .cta { font-size: 40px; padding: 18px 40px; }
  .contact { font-size: 30px; }
  .contact .wa { width: 54px; height: 54px; }
  .gds { position: absolute; left: 56px; top: 452px; }
  .gds span { font-size: 20px; padding: 4px 14px; }
</style>
</head>
<body>
<div class="ad">
  <div class="dots"></div>
  <div class="top">
    <div class="brand"><img src="../assets/logo.png" alt="" /><div><b>Khoozo</b><small>TRAINING</small></div></div>
    <div class="badge"><div><span>সর্বোচ্চ</span><strong>৭০%</strong><span>ছাড়</span></div></div>
  </div>

  <div class="head">
    <span class="ribbon">সীমিত সিট · অনলাইন লাইভ</span>
    <h1 class="headline">ট্রাভেল সেক্টরে<br /><em>ক্যারিয়ার গড়ুন!</em></h1>
  </div>
  <div class="gds"><span>Sabre</span><span>Amadeus</span><span>Galileo</span></div>

  <div class="cards">
    <div class="course">
      <div class="ph"><img src="../assets/training/ticketing.jpg" alt="" /><b>এয়ার টিকেটিং</b></div>
      <p class="meta">৬ সপ্তাহ · ৩৬ ঘণ্টা</p>
      <div class="info"><div><span class="old">১৫,০০০</span><span class="now">৪,৫০০<small> টাকা</small></span></div><span class="off">৭০% ছাড়</span></div>
    </div>
    <div class="course">
      <div class="ph"><img src="../assets/training/visa.jpg" alt="" /><b>ভিসা প্রসেসিং</b></div>
      <p class="meta">৪ সপ্তাহ · ২৪ ঘণ্টা</p>
      <div class="info"><div><span class="old">১০,০০০</span><span class="now">৩,০০০<small> টাকা</small></span></div><span class="off">৭০% ছাড়</span></div>
    </div>
  </div>

  <div class="bottom">
    <div class="contact"><span class="wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg></span>01818-120900</div>
    <span class="cta">এখনই ভর্তি হোন <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
  </div>
</div>
</body>
</html>
